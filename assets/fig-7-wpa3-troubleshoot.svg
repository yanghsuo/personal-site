<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Noto Sans SC', system-ui, sans-serif">
  <defs>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#FBBF24"/></marker>
    <marker id="arS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34D399"/></marker>
  </defs>
  <rect width="720" height="380" rx="14" fill="#0A0B0F"/>
  <text x="24" y="34" fill="#F1F5F9" font-size="17" font-weight="600">图 7　终端连不上 WPA3 的常见原因</text>
  <line x1="24" y1="48" x2="696" y2="48" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <rect x="270" y="64" width="180" height="40" rx="8" fill="rgba(248,113,113,0.12)" stroke="#F87171"/>
  <text x="360" y="84" fill="#FCA5A5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600">连接失败</text>

  <line x1="360" y1="104" x2="103" y2="160" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arA)"/>
  <line x1="360" y1="104" x2="274" y2="160" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arA)"/>
  <line x1="360" y1="104" x2="445" y2="160" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arA)"/>
  <line x1="360" y1="104" x2="617" y2="160" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arA)"/>

  <g font-size="13">
    <rect x="24" y="160" width="158" height="58" rx="8" fill="rgba(251,191,36,0.08)" stroke="#FBBF24"/>
    <text x="103" y="180" fill="#FBBF24" text-anchor="middle" dominant-baseline="central" font-weight="500">系统不支持 SAE</text>
    <text x="103" y="200" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">旧系统 · 旧驱动</text>

    <rect x="195" y="160" width="158" height="58" rx="8" fill="rgba(251,191,36,0.08)" stroke="#FBBF24"/>
    <text x="274" y="180" fill="#FBBF24" text-anchor="middle" dominant-baseline="central" font-weight="500">硬件不支持 PMF</text>
    <text x="274" y="200" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">老网卡 · IoT 设备</text>

    <rect x="366" y="160" width="158" height="58" rx="8" fill="rgba(251,191,36,0.08)" stroke="#FBBF24"/>
    <text x="445" y="180" fill="#FBBF24" text-anchor="middle" dominant-baseline="central" font-weight="500">路由器 WPA3-only</text>
    <text x="445" y="200" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">无 WPA2 回退</text>

    <rect x="538" y="160" width="158" height="58" rx="8" fill="rgba(251,191,36,0.08)" stroke="#FBBF24"/>
    <text x="617" y="180" fill="#FBBF24" text-anchor="middle" dominant-baseline="central" font-weight="500">SAE 实现不兼容</text>
    <text x="617" y="200" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">早期固件 · H2E bug</text>
  </g>

  <line x1="103" y1="218" x2="103" y2="290" stroke="#34D399" stroke-width="1.5" marker-end="url(#arS)"/>
  <line x1="274" y1="218" x2="274" y2="290" stroke="#34D399" stroke-width="1.5" marker-end="url(#arS)"/>
  <line x1="445" y1="218" x2="445" y2="290" stroke="#34D399" stroke-width="1.5" marker-end="url(#arS)"/>
  <line x1="617" y1="218" x2="617" y2="290" stroke="#34D399" stroke-width="1.5" marker-end="url(#arS)"/>

  <g font-size="13">
    <rect x="24" y="290" width="158" height="58" rx="8" fill="rgba(52,211,153,0.10)" stroke="#34D399"/>
    <text x="103" y="310" fill="#34D399" text-anchor="middle" dominant-baseline="central" font-weight="500">升级系统 / 驱动</text>
    <text x="103" y="330" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">Win10 1903+ · iOS 13+</text>

    <rect x="195" y="290" width="158" height="58" rx="8" fill="rgba(52,211,153,0.10)" stroke="#34D399"/>
    <text x="274" y="310" fill="#34D399" text-anchor="middle" dominant-baseline="central" font-weight="500">更新驱动 / 固件</text>
    <text x="274" y="330" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">或改用 WPA2 混合</text>

    <rect x="366" y="290" width="158" height="58" rx="8" fill="rgba(52,211,153,0.10)" stroke="#34D399"/>
    <text x="445" y="310" fill="#34D399" text-anchor="middle" dominant-baseline="central" font-weight="500">改用过渡模式</text>
    <text x="445" y="330" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">WPA2/WPA3 并存</text>

    <rect x="538" y="290" width="158" height="58" rx="8" fill="rgba(52,211,153,0.10)" stroke="#34D399"/>
    <text x="617" y="310" fill="#34D399" text-anchor="middle" dominant-baseline="central" font-weight="500">升级路由器固件</text>
    <text x="617" y="330" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">或保留 WPA2 网段</text>
  </g>
</svg>
