<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 · 杨硕 (Yang Shuo)</title>
<meta name="description" content="杨硕（Yang Shuo）的文章详情页。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* 文章详情页专属 */
  .back-home {
    display: inline-block;
    margin-bottom: 22px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: .5px;
    transition: color .18s ease;
  }
  .back-home:hover { color: var(--accent); }
  .nav a.active { color: var(--accent); }
  .article-detail { max-width: 760px; margin: 0 auto; }
  .ad-meta { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .ad-date { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--text-dim); }
  .ad-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .ad-tags span {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, .35);
    border-radius: 999px;
    padding: 3px 11px;
  }
  .ad-title { font-size: 30px; line-height: 1.3; margin: 0 0 26px; color: var(--text); }
  /* 正文（Markdown 渲染结果） */
  .article-body {
    color: var(--text);
    font-size: 15.5px;
    line-height: 1.85;
    word-break: break-word;
  }
  .article-body h2, .article-body h3, .article-body h4 { color: var(--text); margin: 30px 0 12px; line-height: 1.4; }
  .article-body h2 { font-size: 22px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .article-body h3 { font-size: 19px; }
  .article-body h4 { font-size: 16.5px; }
  .article-body p { margin: 14px 0; color: var(--text-dim); }
  .article-body ul { margin: 14px 0; padding-left: 24px; }
  .article-body li { margin: 6px 0; color: var(--text-dim); }
  .article-body code { font-family: var(--font-mono); background: var(--glass-strong); padding: 2px 7px; border-radius: 6px; color: var(--accent); font-size: 13.5px; }
  .article-body strong { color: var(--text); }
  /* 文章内图表（md2html 的 ![图注](路径) 渲染为 figure） */
  .article-body figure.article-fig { margin: 30px 0; text-align: center; }
  .article-body figure.article-fig img {
    max-width: 100%; height: auto; display: inline-block;
    border: 1px solid var(--line); border-radius: 14px; background: var(--bg-soft);
    box-shadow: 0 14px 46px rgba(0,0,0,.42);
  }
  .article-body figure.article-fig figcaption {
    margin-top: 13px; font-size: 12.5px; color: var(--text-dim);
    font-family: "JetBrains Mono", monospace; letter-spacing: .2px;
  }
  .article-nav {
    display: flex; justify-content: space-between; gap: 16px;
    margin-top: 48px; padding-top: 26px; border-top: 1px solid var(--line);
    max-width: 760px; margin-left: auto; margin-right: auto;
  }
  .article-nav a {
    color: var(--text-dim); text-decoration: none; font-size: 14px;
    transition: color .18s ease;
  }
  .article-nav a:hover { color: var(--accent); }
  .article-missing { text-align: center; padding: 60px 0; }
  .article-missing a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<!-- 顶部光晕 -->
<div class="glow-top" aria-hidden="true"></div>

<!-- ============ Header ============ -->
<header class="site-header">
  <a class="logo" href="index.html">
    <span class="logo-mark"></span>
    杨硕<span class="logo-en">· Yang Shuo</span>
  </a>
  <nav class="nav">
    <a href="index.html#about">关于</a>
    <a href="index.html#skills">技能</a>
    <a href="index.html#experience">经历</a>
    <a href="articles.html" class="active">文章</a>
    <a href="index.html#contact">联系</a>
  </nav>
  <a class="btn btn-ghost header-cta" href="index.html#contact">取得联系</a>
</header>

<main id="top">

  <!-- ============ Article ============ -->
  <section class="section">
    <a class="back-home" href="articles.html">← 返回文章列表</a>
    <span class="eyebrow mono">ARTICLE</span>
    <div class="article-detail" id="articleView">
      <!-- 由页面脚本依据 ?d=日期 渲染对应文章 -->
    </div>
  </section>

</main>

<!-- ============ Footer ============ -->
<footer class="site-footer">
  <div class="footer-divider"></div>
  <div class="footer-top">
    <div class="footer-brand">杨硕 · Yang Shuo</div>
    <nav class="footer-nav">
      <a href="index.html#about">关于</a>
      <a href="index.html#skills">技能</a>
      <a href="index.html#experience">经历</a>
      <a href="articles.html">文章</a>
      <a href="index.html#contact">联系</a>
      <a href="admin.html">后台</a>
    </nav>
  </div>
  <div class="footer-copy mono" data-e="footer.copyright">Copyright 2026 杨硕 (Yang Shuo) · Built with Deep Space Design System</div>
</footer>

<script src="content.js"></script>
<script src="admin.js"></script>
<script>
(function () {
  var view = document.getElementById('articleView');
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  var d = param('d');
  var art = null;
  if (typeof SITE !== 'undefined' && SITE.articles) {
    for (var i = 0; i < SITE.articles.length; i++) {
      if (SITE.articles[i].date === d) { art = SITE.articles[i]; break; }
    }
  }
  if (!art) {
    view.innerHTML = '<div class="article-missing"><h2 class="section-title">未找到该文章</h2>' +
      '<p class="section-lead">请返回<a href="articles.html">文章列表</a>重新选择。</p></div>';
    return;
  }
  document.title = art.title + ' · 杨硕 (Yang Shuo)';
  var tags = (art.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
  var bodyHtml = (window.md2html ? md2html(art.body || '') : '<p>' + esc(art.body || '') + '</p>');
  view.innerHTML =
    '<div class="ad-meta"><div class="ad-date">' + esc(art.date) + '</div>' +
    '<div class="ad-tags">' + tags + '</div></div>' +
    '<h1 class="ad-title">' + esc(art.title) + '</h1>' +
    '<div class="article-body">' + bodyHtml + '</div>';
  var nav = document.createElement('div');
  nav.className = 'article-nav';
  nav.innerHTML = '<a href="articles.html">← 返回文章列表</a><a href="index.html">回到首页 →</a>';
  view.appendChild(nav);
})();
</script>
</body>
</html>
