<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" font-family="'Noto Sans SC', system-ui, sans-serif">
  <rect width="720" height="372" rx="14" fill="#0A0B0F"/>
  <text x="24" y="34" fill="#F1F5F9" font-size="17" font-weight="600">图 4　InfiniBand 胖树（Fat-Tree）拓扑示意</text>
  <line x1="24" y1="48" x2="696" y2="48" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- links -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.85">
    <!-- servers -> leaves -->
    <line x1="90" y1="300" x2="90" y2="244"/>
    <line x1="230" y1="300" x2="230" y2="244"/>
    <line x1="470" y1="300" x2="470" y2="244"/>
    <line x1="610" y1="300" x2="610" y2="244"/>
    <!-- leaves -> spine -->
    <line x1="155" y1="206" x2="155" y2="158"/>
    <line x1="515" y1="206" x2="515" y2="158"/>
  </g>
  <!-- spine -> SM (dashed) -->
  <line x1="570" y1="138" x2="612" y2="92" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Spine -->
  <rect x="250" y="118" width="320" height="40" rx="9" fill="rgba(56,189,248,0.14)" stroke="#38BDF8"/>
  <text x="410" y="143" fill="#F1F5F9" font-size="13" font-weight="600" text-anchor="middle">Spine 汇聚交换机</text>
  <!-- Leaves -->
  <rect x="70" y="206" width="170" height="38" rx="9" fill="rgba(56,189,248,0.12)" stroke="#38BDF8"/>
  <text x="155" y="230" fill="#F1F5F9" font-size="12.5" text-anchor="middle">Leaf 接入 (ToR)</text>
  <rect x="410" y="206" width="210" height="38" rx="9" fill="rgba(56,189,248,0.12)" stroke="#38BDF8"/>
  <text x="515" y="230" fill="#F1F5F9" font-size="12.5" text-anchor="middle">Leaf 接入 (ToR)</text>
  <!-- Servers -->
  <g>
    <rect x="40" y="300" width="100" height="44" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="90" y="318" fill="#F1F5F9" font-size="11.5" text-anchor="middle">服务器</text>
    <text x="90" y="335" fill="#34D399" font-size="11" text-anchor="middle">+ HCA</text>
    <rect x="180" y="300" width="100" height="44" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="230" y="318" fill="#F1F5F9" font-size="11.5" text-anchor="middle">服务器</text>
    <text x="230" y="335" fill="#34D399" font-size="11" text-anchor="middle">+ HCA</text>
    <rect x="420" y="300" width="100" height="44" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="470" y="318" fill="#F1F5F9" font-size="11.5" text-anchor="middle">服务器</text>
    <text x="470" y="335" fill="#34D399" font-size="11" text-anchor="middle">+ HCA</text>
    <rect x="560" y="300" width="100" height="44" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="610" y="318" fill="#F1F5F9" font-size="11.5" text-anchor="middle">服务器</text>
    <text x="610" y="335" fill="#34D399" font-size="11" text-anchor="middle">+ HCA</text>
  </g>
  <!-- Subnet Manager -->
  <rect x="612" y="64" width="84" height="56" rx="9" fill="rgba(251,191,36,0.12)" stroke="#FBBF24"/>
  <text x="654" y="86" fill="#FBBF24" font-size="11.5" font-weight="600" text-anchor="middle">子网管理器</text>
  <text x="654" y="104" fill="#F1F5F9" font-size="11.5" text-anchor="middle">SM</text>

  <text x="24" y="356" fill="#94A3B8" font-size="12">胖树（Fat-Tree）让任意两节点间的可用带宽相等，避免热点、实现近无阻塞转发；整网由 SM 集中分配 LID、计算路由与分区。</text>
</svg>
