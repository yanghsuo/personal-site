<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Noto Sans SC', system-ui, sans-serif">
  <defs>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#38BDF8"/></marker>
  </defs>
  <rect width="720" height="420" rx="14" fill="#0A0B0F"/>
  <text x="24" y="34" fill="#F1F5F9" font-size="17" font-weight="600">图 6　WPA2 与 WPA3 认证流程对比</text>
  <line x1="24" y1="48" x2="696" y2="48" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <text x="186" y="76" fill="#F1F5F9" font-size="14" font-weight="600" text-anchor="middle">WPA2 · 2004<tspan fill="#94A3B8" font-size="12" font-weight="400">　PSK 四次握手</tspan></text>
  <text x="534" y="76" fill="#F1F5F9" font-size="14" font-weight="600" text-anchor="middle">WPA3 · 2018<tspan fill="#7DD3FC" font-size="12" font-weight="400">　SAE 认证</tspan></text>

  <g font-size="13">
    <rect x="36" y="90" width="300" height="52" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="186" y="109" fill="#F1F5F9" text-anchor="middle" dominant-baseline="central" font-weight="500">密码 / PSK</text>
    <text x="186" y="127" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">双方预共享同一个密钥</text>

    <rect x="36" y="160" width="300" height="52" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="186" y="179" fill="#F1F5F9" text-anchor="middle" dominant-baseline="central" font-weight="500">PBKDF2 派生 PMK</text>
    <text x="186" y="197" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">确定性派生，无随机化</text>

    <rect x="36" y="230" width="300" height="52" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="186" y="249" fill="#F1F5F9" text-anchor="middle" dominant-baseline="central" font-weight="500">4-way handshake</text>
    <text x="186" y="267" fill="#FBBF24" text-anchor="middle" dominant-baseline="central" font-size="11.5">抓包后可离线穷举</text>

    <rect x="36" y="300" width="300" height="52" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="186" y="319" fill="#F1F5F9" text-anchor="middle" dominant-baseline="central" font-weight="500">CCMP-AES128</text>
    <text x="186" y="337" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" font-size="11.5">加密通信</text>
  </g>
  <line x1="186" y1="142" x2="186" y2="160" stroke="#64748B" stroke-width="1.6" marker-end="url(#arG)"/>
  <line x1="186" y1="212" x2="186" y2="230" stroke="#64748B" stroke-width="1.6" marker-end="url(#arG)"/>
  <line x1="186" y1="282" x2="186" y2="300" stroke="#64748B" stroke-width="1.6" marker-end="url(#arG)"/>

  <rect x="36" y="366" width="300" height="26" rx="13" fill="rgba(251,191,36,0.12)" stroke="#FBBF24"/>
  <text x="186" y="379" fill="#FBBF24" text-anchor="middle" dominant-baseline="central" font-size="12.5">× 抗离线破解　× 前向保密</text>

  <g font-size="13">
    <rect x="384" y="90" width="300" height="52" rx="8" fill="rgba(56,189,248,0.10)" stroke="#38BDF8"/>
    <text x="534" y="109" fill="#F1F5F9" text-anchor="middle" dominant-baseline="central" font-weight="500">密码</text>
    <text x="534" y="127" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central" font-size="11.5">弱密码也能抗离线攻击</text>

    <rect x="384" y="160" width="300" height="52" rx="8" fill="rgba(56,189,248,0.10)" stroke="#38BDF8"/>
    <text x="534" y="179" fill="#F1F5F9" text-anchor="middle" dominant-baseline="central" font-weight="500">SAE 在线握手</text>
    <text x="534" y="197" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central" font-size="11.5">Dragonfly · ECC 交换</text>

    <rect x="384" y="230" width="300" height="52" rx="8" fill="rgba(56,189,248,0.10)" stroke="#38BDF8"/>
    <text x="534" y="249" fill="#F1F5F9" text-anchor="middle" dominant-baseline="central" font-weight="500">PMK 会话独立</text>
    <text x="534" y="267" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central" font-size="11.5">前向保密</text>

    <rect x="384" y="300" width="300" height="52" rx="8" fill="rgba(56,189,248,0.10)" stroke="#38BDF8"/>
    <text x="534" y="319" fill="#F1F5F9" text-anchor="middle" dominant-baseline="central" font-weight="500">4-way + PMF 强制</text>
    <text x="534" y="337" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central" font-size="11.5">管理帧也加密</text>
  </g>
  <line x1="534" y1="142" x2="534" y2="160" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arB)"/>
  <line x1="534" y1="212" x2="534" y2="230" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arB)"/>
  <line x1="534" y1="282" x2="534" y2="300" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arB)"/>

  <rect x="384" y="366" width="300" height="26" rx="13" fill="rgba(52,211,153,0.12)" stroke="#34D399"/>
  <text x="534" y="379" fill="#34D399" text-anchor="middle" dominant-baseline="central" font-size="12.5">✓ 抗离线破解　✓ 前向保密　✓ PMF</text>
</svg>
