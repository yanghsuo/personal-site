<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
/* ========== Reset & Vars ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--card:#fff;--text:#1a1a2e;--muted:#6b7280;
  --accent:#2563eb;--accent-light:#dbeafe;--border:#e5e7eb;
  --radius:10px;--nav-h:60px;--mw:800px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}

/* ========== Nav ========== */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  background:rgba(250,250,250,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
}
.nav-inner{max-width:var(--mw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 20px}
.nav-logo{font-weight:700;font-size:17px;color:var(--text);display:flex;align-items:center;gap:8px}
.nav-logo:hover{text-decoration:none}
.nav-links{display:flex;gap:24px;list-style:none}
.nav-links a{color:var(--muted);font-size:14px;font-weight:500;transition:color .15s}
.nav-links a:hover{color:var(--accent);text-decoration:none}

/* ========== Layout ========== */
main{max-width:var(--mw);margin:0 auto;padding:0 20px}
section{padding:64px 0}
section+section{border-top:1px solid var(--border)}

/* ========== Hero ========== */
#hero{padding-top:calc(var(--nav-h) + 48px);padding-bottom:48px;display:flex;align-items:flex-start;gap:24px}
.hero-avatar{
  width:80px;height:80px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:32px;
}
.hero-info{flex:1}
.hero-name{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.hero-role{font-size:15px;color:var(--muted);margin-top:4px}
.hero-tagline{margin-top:10px;font-size:14px;color:var(--muted);line-height:1.6;max-width:480px}
.hero-links{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.hero-links a{
  display:inline-flex;align-items:center;gap:4px;padding:5px 14px;
  border-radius:16px;background:var(--card);border:1px solid var(--border);
  font-size:13px;font-weight:500;transition:all .15s;
}
.hero-links a:hover{border-color:var(--accent);text-decoration:none}

/* ========== Skills (inline) ========== */
.skills-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.skill-chip{
  padding:4px 14px;border-radius:16px;border:1px solid var(--border);
  font-size:13px;font-weight:500;background:var(--card);color:var(--muted);
}

/* ========== Timeline ========== */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:32px}
.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.timeline-date{font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.timeline-title{font-size:17px;font-weight:700;margin:2px 0}
.timeline-sub{font-size:13px;color:var(--muted)}
.timeline-desc{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.7}

/* ========== Projects ========== */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.project-card{
  padding:20px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--card);transition:all .2s;position:relative;
}
.project-card:hover{box-shadow:0 8px 30px rgba(0,0,0,.06);transform:translateY(-1px)}
.project-icon{font-size:24px;margin-bottom:10px}
.project-name{font-size:16px;font-weight:700;margin-bottom:4px}
.project-desc{font-size:13px;color:var(--muted);line-height:1.6}
.project-stack{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px}
.project-stack span{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--accent-light);color:var(--accent);font-weight:500}

/* ========== Blog / Articles ========== */
.articles-grid{display:grid;grid-template-columns:1fr;gap:12px}
.article-card{
  padding:20px 24px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--card);cursor:pointer;transition:all .2s;position:relative;
}
.article-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(0,0,0,.04)}
.article-date{font-size:12px;color:var(--accent);font-weight:600}
.article-title{font-size:18px;font-weight:700;margin:4px 0 6px}
.article-summary{font-size:13px;color:var(--muted);line-height:1.6}
.article-tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.article-tags span{font-size:11px;padding:1px 8px;border-radius:8px;background:#f3f4f6;color:var(--muted)}

/* ========== Article detail modal ========== */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.4);backdrop-filter:blur(4px);
  align-items:flex-start;justify-content:center;padding:40px 20px;
  overflow-y:auto;
}
.modal-overlay.open{display:flex}
.modal-content{
  width:100%;max-width:720px;background:var(--card);border-radius:14px;
  padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.15);
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal-close{
  float:right;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.modal-close:hover{background:var(--text);color:#fff;border-color:var(--text)}
.article-full-title{font-size:26px;font-weight:800;margin-bottom:6px}
.article-full-date{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:24px}
.article-body{font-size:15px;line-height:1.9;color:var(--text)}
.article-body p{margin-bottom:16px}
.article-body code{
  background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:13px;
  font-family:"SF Mono","Fira Code",monospace;
}
.article-body pre{
  background:#1e293b;color:#e2e8f0;padding:16px 20px;border-radius:8px;
  overflow-x:auto;margin-bottom:16px;font-size:13px;line-height:1.6;
}
.article-body pre code{background:none;padding:0;color:inherit}
.article-body strong{font-weight:700}
.article-body em{font-style:italic}
.article-body a{text-decoration:underline}

/* ========== Footer / Contact ========== */
footer{padding:32px 20px 40px;border-top:1px solid var(--border);max-width:var(--mw);margin:0 auto}
.footer-contact{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px}
.footer-contact span{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.footer-copy{font-size:12px;color:var(--muted)}

/* ========== Edit mode ========== */
body.editing .editable{cursor:text;transition:all .12s}
body.editing .editable:hover{background:#fffbeb;border-radius:3px;outline:2px dashed #f59e0b;outline-offset:2px}
body.editing .editable:focus{outline:2px solid var(--accent);background:#eff6ff}
body.editing [contenteditable]:empty::before{content:attr(data-placeholder);color:#d1d5db}

.edit-btn{
  position:fixed;bottom:20px;right:20px;z-index:200;
  width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,.3);
  transition:all .15s;display:flex;align-items:center;justify-content:center;
}
.edit-btn:hover{transform:scale(1.08)}
.edit-btn.active{background:#ef4444}

.edit-panel{
  display:none;position:fixed;bottom:72px;right:20px;z-index:200;
  flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.1);
  min-width:170px;
}
body.editing .edit-panel{display:flex}
.edit-panel button{
  padding:7px 12px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg);cursor:pointer;font-size:12px;font-weight:500;
  transition:all .12s;text-align:left;
}
.edit-panel button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.del-btn{
  display:none;position:absolute;top:-8px;right:-8px;
  width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;border:none;
  font-size:11px;cursor:pointer;line-height:1;align-items:center;justify-content:center;
}
body.editing .del-btn{display:flex}

/* ========== Password modal ========== */
.pw-overlay{
  display:none;position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,.5);align-items:center;justify-content:center;
}
.pw-overlay.open{display:flex}
.pw-box{
  background:var(--card);border-radius:14px;padding:32px;width:320px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center;
}
.pw-box h3{margin-bottom:8px;font-size:18px}
.pw-box p{font-size:13px;color:var(--muted);margin-bottom:16px}
.pw-box input{
  width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;
  font-size:15px;outline:none;text-align:center;
}
.pw-box input:focus{border-color:var(--accent)}
.pw-box .pw-btns{margin-top:12px;display:flex;gap:8px;justify-content:center}
.pw-box button{
  padding:8px 20px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg);cursor:pointer;font-size:14px;font-weight:500;
}
.pw-box button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.pw-error{color:#ef4444;font-size:12px;margin-top:8px;display:none}

/* ========== Mobile ========== */
@media(max-width:640px){
  #hero{flex-direction:column;align-items:center;text-align:center;gap:16px}
  .hero-tagline{margin-left:auto;margin-right:auto}
  .hero-links{justify-content:center}
  .hero-name{font-size:26px}
  .nav-links{gap:14px}.nav-links a{font-size:12px}
  section{padding:44px 0}
  .section-title{font-size:22px}
  .projects-grid{grid-template-columns:1fr}
  .modal-content{padding:24px}
  .article-full-title{font-size:22px}
}
</style>
</head>
<body>

<script src="content.js"></script>

<script>
// ==================== 数据层 ====================
const saved = localStorage.getItem('mysite_data');
const D = saved ? JSON.parse(saved) : (window.SITE || {});

function ensureDefaults(){
  D.title = D.title || '个人主页';
  D.editPassword = D.editPassword || 'admin123';
  D.nav = D.nav || {
    logo: '👤 你的名字',
    links: [
      {label:'关于',href:'#about'},{label:'经历',href:'#experience'},
      {label:'项目',href:'#projects'},{label:'文章',href:'#articles'},{label:'联系',href:'#contact'}
    ]
  };
  D.hero = D.hero || {emoji:'🧑‍💻',name:'你的名字',role:'头衔 · 城市',tagline:'简短的一句话自我介绍',links:[{icon:'📄',label:'简历',url:'#'},{icon:'🐙',label:'GitHub',url:'#'}]};
  D.about = D.about || {label:'About',title:'关于我',desc:'更详细的自我介绍…'};
  D.skills = D.skills || ['Kubernetes','Linux','网络','Python','SRE','监控'];
  D.timeline = D.timeline || [{date:'2024 - 至今',title:'公司',subtitle:'职位',desc:'工作内容'}];
  D.projects = D.projects || [{icon:'🔧',name:'项目',desc:'描述',stack:['技术']}];
  D.articles = D.articles || [{id:'1',date:'2026-07-23',title:'示例文章：如何搭建个人网站',summary:'这是一篇示例文章，点击阅读全文。','content':'这是文章正文。\n\n你可以在这里写任何内容。支持**粗体**、*斜体*和`行内代码`。\n\n```\n// 也支持代码块\nconsole.log("Hello World");\n```\n\n文章写完后点击右上角关闭即可。',tags:['教程','Web']}];
  D.contact = D.contact || [{icon:'📧',text:'email@example.com'},{icon:'🐙',text:'github.com/xxx'}];
  D.footer = D.footer || '© 2026 你的名字';
  saveData();
}
ensureDefaults();

// ==================== 渲染引擎 ====================
const E = (tag, attrs = {}, ...children) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'className') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'string') el.style.cssText = v;
    else el.setAttribute(k, v);
  }
  for (const child of children) el.append(typeof child==='string'?document.createTextNode(child):child);
  return el;
};

const DG = p => p.split('.').reduce((o,k)=>{
  if(o==null)return'';
  const m=k.match(/^(\w+)\[(\d+)\]$/);
  return m?(o[m[1]]||[])[+m[2]]:o[k];
},D)??'';

const DS = (p, v) => {
  const ks = p.split('.'); let o = D;
  for(let i=0;i<ks.length-1;i++){
    const m=ks[i].match(/^(\w+)\[(\d+)\]$/);
    o=m?(o[m[1]]||[])[+m[2]]:o[ks[i]];
  }
  const l=ks[ks.length-1], lm=l.match(/^(\w+)\[(\d+)\]$/);
  lm?(o[lm[1]][+lm[2]]=v):(o[l]=v);
  saveData();
};

// 可编辑 span
const ED = (field, ph='') => E('span',{className:'editable','data-field':field,'data-placeholder':ph},DG(field)||ph);

// ==================== Markdown → HTML ====================
function md2html(text){
  if(!text)return'';
  // 预处理代码块
  const blocks=[];
  let t=text.replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>{
    blocks.push(`<pre><code>${escHtml(code.trim())}</code></pre>`);
    return `%%BLOCK${blocks.length-1}%%`;
  });
  // 按段落分割
  const paras=t.split(/\n\n+/).filter(Boolean).map(p=>{
    p=p.trim();
    if(p.startsWith('%%BLOCK'))return p;
    // 行内格式
    p=p.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    p=p.replace(/\*(.+?)\*/g,'<em>$1</em>');
    p=p.replace(/`([^`]+)`/g,'<code>$1</code>');
    p=p.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
    return `<p>${p}</p>`;
  });
  return paras.map(p=>p.startsWith('%%BLOCK')?blocks[+p.match(/\d+/)[0]]:p).join('\n');
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ==================== 渲染页面 ====================
function render(){
  document.body.innerHTML='';
  document.title=D.title;

  // Nav
  const nav=E('nav',{},
    E('div',{className:'nav-inner'},
      E('a',{href:'#hero',className:'nav-logo'},ED('nav.logo','Logo')),
      E('ul',{className:'nav-links'},...D.nav.links.map((l,i)=>
        E('li',{},E('a',{href:l.href},ED(`nav.links[${i}].label`,'导航')))
      ))
    )
  );

  const main=E('main',{});

  // ---- Hero ----
  main.append(E('section',{id:'hero'},
    E('div',{className:'hero-avatar'},ED('hero.emoji','😀')),
    E('div',{className:'hero-info'},
      E('h1',{className:'hero-name'},ED('hero.name','名字')),
      E('p',{className:'hero-role'},ED('hero.role','头衔')),
      E('p',{className:'hero-tagline'},ED('hero.tagline','一句话介绍')),
      E('div',{className:'hero-links','data-list':'hero.links'},...D.hero.links.map((l,i)=>
        E('div',{style:'position:relative;display:inline-flex'},
          E('a',{href:l.url||'#',target:'_blank'},
            E('span',{className:'editable','data-field':`hero.links[${i}].icon`,'data-placeholder':'🔗',style:'margin-right:2px'},l.icon),
            E('span',{className:'editable','data-field':`hero.links[${i}].label`,'data-placeholder':'链接'},l.label)
          ),
          E('button',{className:'del-btn',onclick:()=>{D.hero.links.splice(i,1);saveData();render()}},'×')
        )
      ))
    )
  ));

  // ---- About + Skills (合并) ----
  main.append(E('section',{id:'about'},
    E('div',{className:'section-label'},ED('about.label','LABEL')),
    E('h2',{className:'section-title',style:'margin-bottom:12px'},ED('about.title','标题')),
    E('p',{className:'section-desc',style:'margin-bottom:16px'},ED('about.desc','介绍…')),
    E('div',{className:'skills-row','data-list':'skills'},...D.skills.map((s,i)=>
      E('div',{className:'skill-chip',style:'position:relative'},
        E('span',{className:'editable','data-field':`skills[${i}]`,'data-placeholder':'技能'},s),
        E('button',{className:'del-btn',style:'top:-6px;right:-6px',onclick:()=>{D.skills.splice(i,1);saveData();render()}},'×')
      )
    ))
  ));

  // ---- Experience ----
  main.append(E('section',{id:'experience'},
    E('div',{className:'section-label'},'Experience'),
    E('h2',{className:'section-title'},'工作经历'),
    E('div',{className:'timeline','data-list':'timeline'},...D.timeline.map((t,i)=>
      E('div',{className:'timeline-item',style:'position:relative'},
        E('div',{className:'timeline-dot'}),
        E('div',{className:'timeline-date'},ED(`timeline[${i}].date`,'日期')),
        E('h3',{className:'timeline-title'},ED(`timeline[${i}].title`,'标题')),
        E('p',{className:'timeline-sub'},ED(`timeline[${i}].subtitle`,'副标题')),
        E('p',{className:'timeline-desc'},ED(`timeline[${i}].desc`,'描述')),
        E('button',{className:'del-btn',style:'top:0;right:0',onclick:()=>{D.timeline.splice(i,1);saveData();render()}},'×')
      )
    ))
  ));

  // ---- Projects ----
  main.append(E('section',{id:'projects'},
    E('div',{className:'section-label'},'Projects'),
    E('h2',{className:'section-title'},'项目'),
    E('div',{className:'projects-grid','data-list':'projects'},...D.projects.map((p,i)=>
      E('div',{className:'project-card'},
        E('div',{className:'project-icon'},ED(`projects[${i}].icon`,'🔧')),
        E('h3',{className:'project-name'},ED(`projects[${i}].name`,'项目名')),
        E('p',{className:'project-desc'},ED(`projects[${i}].desc`,'描述')),
        E('div',{className:'project-stack','data-list':`projects[${i}].stack`},...(p.stack||[]).map((s,j)=>
          E('span',{style:'position:relative'},
            E('span',{className:'editable','data-field':`projects[${i}].stack[${j}]`,'data-placeholder':'技术'},s),
            E('button',{className:'del-btn',style:'top:-5px;right:-5px',onclick:()=>{D.projects[i].stack.splice(j,1);saveData();render()}},'×')
          )
        )),
        E('button',{className:'del-btn',onclick:()=>{D.projects.splice(i,1);saveData();render()}},'×')
      )
    ))
  ));

  // ---- Articles (Blog) ----
  const articlesSection = E('section',{id:'articles'},
    E('div',{className:'section-label'},'Articles'),
    E('h2',{className:'section-title'},'文章'),
    E('div',{className:'articles-grid','data-list':'articles'},...D.articles.map((a,i)=>
      E('div',{className:'article-card',onclick:(e)=>{
        if(document.body.classList.contains('editing'))return;
        if(e.target.closest('.del-btn'))return;
        openArticle(i);
      },style:'position:relative'},
        E('div',{className:'article-date'},ED(`articles[${i}].date`,'日期')),
        E('h3',{className:'article-title'},ED(`articles[${i}].title`,'标题')),
        E('p',{className:'article-summary'},ED(`articles[${i}].summary`,'摘要')),
        (a.tags&&a.tags.length)?E('div',{className:'article-tags'},...a.tags.map((t,j)=>
          E('span',{style:'position:relative'},
            E('span',{className:'editable','data-field':`articles[${i}].tags[${j}]`,'data-placeholder':'标签'},t),
            E('button',{className:'del-btn',style:'top:-5px;right:-5px',onclick:(ev)=>{ev.stopPropagation();D.articles[i].tags.splice(j,1);saveData();render()}},'×')
          )
        )):null,
        E('button',{className:'del-btn',onclick:(ev)=>{ev.stopPropagation();D.articles.splice(i,1);saveData();render()}},'×')
      )
    ))
  );
  main.append(articlesSection);

  document.body.appendChild(main);

  // ---- Footer / Contact ----
  document.body.appendChild(E('footer',{id:'contact'},
    E('div',{className:'footer-contact','data-list':'contact'},...D.contact.map((c,i)=>
      E('span',{style:'position:relative'},
        E('span',{className:'editable','data-field':`contact[${i}].icon`,'data-placeholder':'📧',style:'margin-right:4px'},c.icon),
        E('span',{className:'editable','data-field':`contact[${i}].text`,'data-placeholder':'内容'},c.text),
        E('button',{className:'del-btn',onclick:()=>{D.contact.splice(i,1);saveData();render()}},'×')
      )
    )),
    E('div',{className:'footer-copy'},ED('footer','页脚'))
  ));

  // ---- 文章阅读弹窗 ----
  const modal=E('div',{className:'modal-overlay',id:'articleModal',onclick(e){if(e.target===this)closeArticle()}},
    E('div',{className:'modal-content'})
  );
  document.body.appendChild(modal);

  // ---- 编辑按钮 + 面板 ----
  const editBtn=E('button',{className:'edit-btn',id:'editBtn',title:'编辑',onclick:handleEditClick},'✏️');
  const editPanel=E('div',{className:'edit-panel',id:'editPanel'},
    E('button',{onclick:()=>{D.skills.push('新技能');saveData();render();enterEdit()}},'➕ 技能'),
    E('button',{onclick:()=>{D.timeline.push({date:'日期',title:'标题',subtitle:'副标题',desc:'描述'});saveData();render();enterEdit()}},'➕ 经历'),
    E('button',{onclick:()=>{D.projects.push({icon:'🔧',name:'项目',desc:'描述',stack:['技术']});saveData();render();enterEdit()}},'➕ 项目'),
    E('button',{onclick:()=>{D.articles.push({id:Date.now().toString(),date:new Date().toISOString().slice(0,10),title:'新文章',summary:'摘要',content:'正文…',tags:['标签']});saveData();render();enterEdit()}},'➕ 文章'),
    E('button',{onclick:()=>{D.contact.push({icon:'📧',text:'新联系方式'});saveData();render();enterEdit()}},'➕ 联系方式'),
    E('button',{onclick:()=>{D.hero.links.push({icon:'🔗',label:'链接',url:'#'});saveData();render();enterEdit()}},'➕ 社交链接'),
    E('button',{onclick:changePassword},'🔑 改密码'),
    E('button',{onclick:()=>{if(confirm('重置所有内容？不可恢复！')){localStorage.removeItem('mysite_data');location.reload()}}},'🔄 重置'),
    E('button',{onclick:downloadConfig,style:'background:#10b981;color:#fff;border-color:#10b981'},'💾 导出配置'),
  );
  document.body.appendChild(editBtn);
  document.body.appendChild(editPanel);

  // ---- 密码弹窗 ----
  const pwOverlay=E('div',{className:'pw-overlay',id:'pwOverlay'},
    E('div',{className:'pw-box'},
      E('h3',{},'🔐 输入编辑密码'),
      E('p',{},'只有网站所有者可以编辑内容'),
      E('input',{type:'password',id:'pwInput',placeholder:'输入密码…',onkeydown(e){if(e.key==='Enter')verifyPassword()}}),
      E('p',{className:'pw-error',id:'pwError'},'密码错误'),
      E('div',{className:'pw-btns'},
        E('button',{onclick:()=>{document.getElementById('pwOverlay').classList.remove('open')}},'取消'),
        E('button',{className:'primary',onclick:verifyPassword},'确认')
      )
    )
  );
  document.body.appendChild(pwOverlay);

  // 恢复编辑状态（会话级）
  if(sessionStorage.getItem('edit_authed')==='1') enterEdit();
}

// ==================== 文章阅读 ====================
function openArticle(i){
  const a=D.articles[i];if(!a)return;
  const modal=document.getElementById('articleModal');
  const content=modal.querySelector('.modal-content');
  content.innerHTML='';
  content.append(
    E('button',{className:'modal-close',onclick:closeArticle},'✕'),
    E('h1',{className:'article-full-title'},a.title),
    E('div',{className:'article-full-date'},a.date),
    E('div',{className:'article-body',html:md2html(a.content)})
  );
  modal.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeArticle(){
  document.getElementById('articleModal').classList.remove('open');
  document.body.style.overflow='';
}

// ==================== 编辑模式 ====================
function handleEditClick(){
  if(document.body.classList.contains('editing')){
    exitEdit();
  } else {
    document.getElementById('pwOverlay').classList.add('open');
    document.getElementById('pwInput').value='';
    document.getElementById('pwError').style.display='none';
    setTimeout(()=>document.getElementById('pwInput').focus(),100);
  }
}

function verifyPassword(){
  const input=document.getElementById('pwInput').value;
  if(input===D.editPassword){
    sessionStorage.setItem('edit_authed','1');
    document.getElementById('pwOverlay').classList.remove('open');
    enterEdit();
  } else {
    document.getElementById('pwError').style.display='block';
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
  }
}

function enterEdit(){
  document.body.classList.add('editing');
  const btn=document.getElementById('editBtn');
  btn.textContent='✓';btn.classList.add('active');
  document.querySelectorAll('.editable').forEach(el=>{
    el.contentEditable='true';
    el.addEventListener('blur',onBlur);
    el.addEventListener('keydown',onKey);
  });
}

function exitEdit(){
  document.body.classList.remove('editing');
  const btn=document.getElementById('editBtn');
  btn.textContent='✏️';btn.classList.remove('active');
  sessionStorage.removeItem('edit_authed');
  document.querySelectorAll('.editable').forEach(el=>{
    el.contentEditable='false';
    el.removeEventListener('blur',onBlur);
    el.removeEventListener('keydown',onKey);
  });
}

function onBlur(e){
  const f=e.target.getAttribute('data-field');
  if(f)DS(f,e.target.textContent.trim());
}

function onKey(e){
  // Enter to add new paragraph in article content fields
  if(e.key==='Enter'&&!e.shiftKey){
    const f=e.target.getAttribute('data-field');
    if(f&&f.includes('articles')&&f.includes('content')){
      e.preventDefault();
      document.execCommand('insertLineBreak');
    }
  }
}

// ==================== 改密码 ====================
function changePassword(){
  const np=prompt('请输入新密码（至少4位）：');
  if(!np||np.length<4){alert('密码至少4位');return;}
  D.editPassword=np;saveData();
  alert('密码已更新！请牢记：'+np);
}

// ==================== 导出 ====================
function downloadConfig(){
  document.querySelectorAll('.editable').forEach(el=>{
    const f=el.getAttribute('data-field');
    if(f)DS(f,el.textContent.trim());
  });
  const js='// 个人网站配置\n// 密码: '+D.editPassword+'\n\nconst SITE = '+JSON.stringify(D,null,2)+';\n';
  const blob=new Blob([js],{type:'application/javascript'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='content.js';a.click();
  URL.revokeObjectURL(a.href);
}

// ==================== 平滑滚动 ====================
document.addEventListener('click',e=>{
  if(document.body.classList.contains('editing'))return;
  const a=e.target.closest('a[href^="#"]');
  if(a){e.preventDefault();const t=document.querySelector(a.getAttribute('href'));if(t)t.scrollIntoView({behavior:'smooth'})}
});

// ==================== 启动 ====================
render();
</script>
